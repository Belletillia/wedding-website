  <section class="section text-center">
    <div class="container">
      <span class="eyebrow">Kindly Reply</span>
      <h1>RSVP</h1>
      <hr class="divider">
      <p style="max-width: 600px; margin: 0 auto;">
        If you have any questions, visit our <a href="faq.html">FAQ page</a>.
      </p>
    </div>
  </section>

  <section class="section" style="padding-top:0;">
    <div class="container">

      <!--
        NETLIFY FORMS SETUP
        - data-netlify="true" tells Netlify to detect and capture this form at deploy time.
        - name="rsvp" is the form's identifier; submissions are grouped under this name
          in your Netlify dashboard (Site settings > Forms).
        - The hidden "form-name" input is required so Netlify's bot can match the
          submission to this form.
        - netlify-honeypot + the visually hidden "bot-field" input is spam protection:
          real visitors never see or fill it in; bots that auto-fill every field will,
          and Netlify silently discards those submissions.
        - action="/rsvp-success.html" sends guests to a thank-you page after submitting.
      -->
      <form
        name="rsvp"
        method="POST"
        action="/rsvp-success.html"
        data-netlify="true"
        netlify-honeypot="bot-field"
        class="rsvp-form"
      >
        <input type="hidden" name="form-name" value="rsvp">
        <p class="hidden-field">
          <label>Don't fill this out if you're human: <input name="bot-field"></label>
        </p>

        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Jane Doe" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="jane@example.com" required>
        </div>

        <div class="form-group">
          <label>Will You Be Attending?</label>
          <div class="radio-group">
            <label><input type="radio" name="attending" value="yes" required> Joyfully Accepts</label>
            <label><input type="radio" name="attending" value="no"> Regretfully Declines</label>
          </div>
        </div>

        <div id="attending-details">
          <div class="form-group">
            <label for="dietary">Dietary Restrictions / Allergies</label>
            <input type="text" id="dietary" name="dietary" placeholder="Optional">
          </div>

          <div class="form-group">
            <label for="song">Song Request</label>
            <input type="text" id="song" name="song" placeholder="What will get you on the dance floor?">
          </div>

          <div class="form-group">
            <div class="radio-group">
              <label><input type="checkbox" name="parking" value="yes"> I will need a parking spot on the day</label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="message">Message for the Couple</label>
          <textarea id="message" name="message" placeholder="Optional"></textarea>
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-primary">Send RSVP</button>
        </div>
      </form>

    </div>
  </section>

  <footer class="site-footer">
    <span class="site-title">Tis &amp; Is</span>
    <p>We can't wait to celebrate with you on June 26th, 2027!</p>
  </footer>

  <script src="js/main.js"></script>
</body>
